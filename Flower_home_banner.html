<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Agrya <br>Ayurveda</title>
<style>
@import url('https://fonts.googleapis.com/css2?family=Outfit:wght@300;400;500;600&family=Playfair+Display:ital,wght@0,400..900;1,400..900&display=swap');
@import url('https://api.fontshare.com/v2/css?f[]=general-sans@400,500,600&display=swap');

.agrya-banner,
.agrya-banner * {
    margin: 0;
    padding: 0;
    box-sizing: border-box;
}
.agrya-banner {
    background-color: #000000;
    height: 100vh;
    height: 100svh;
    min-height: 100vh;
    min-height: 100svh;
    width: 100%;
    flex-shrink: 0;
    position: relative;
    isolation: isolate;
    overflow: hidden;
}

/* ---------- Top gradient overlay ---------- */
.agrya-banner #top-gradient {
    position: absolute;
    top: 0;
    left: 0;
    width: 100%;
    height: 55vh;
    display: block;
    z-index: 0;
    pointer-events: none;
    background: radial-gradient(ellipse 90% 60% at 50% 0%, rgba(0,0,0,0.95) 0%, rgba(0,0,0,0.75) 35%, rgba(0,0,0,0.35) 65%, rgba(0,0,0,0) 100%);
    filter: blur(6px);
}

/* ---------- Hero content ---------- */
.agrya-banner .hero-content {
    position: relative;
    z-index: 2;
    min-height: 100%;
    display: flex;
    flex-direction: column;
    align-items: center;
    text-align: center;
    padding-top: 8vh;
    width: 95%;
    max-width: 1100px;
    margin: 0 auto;
}

.agrya-banner .hero-title {
    font-family: 'Playfair Display', Georgia, serif;
    font-size: 2.8rem;
    font-weight: 400;
    color: #ffffff;
    line-height: 1.15;
    margin-bottom: 0;
    letter-spacing: -0.015em;
    text-shadow: 0 4px 30px rgba(0, 0, 0, 0.5);
}

/* ---------- Footer block ---------- */
.agrya-banner .footer-container {
    position: absolute;
    top: 50vh;
    left: 20px;
    right: 20px;
    width: auto;
    transform: translateY(-50%);
    z-index: 3;
    display: flex;
    flex-direction: column;
}
.agrya-banner .footer-top {
    display: flex;
    justify-content: space-between;
    align-items: flex-end;
    width: 100%;
    padding: 0 5px;
}
.agrya-banner .footer-title {
    font-family: 'General Sans', -apple-system, sans-serif;
    font-size: 1.4rem;
    font-weight: 400;
    color: #ffffff;
    letter-spacing: -0.015em;
    margin: 0;
}
.agrya-banner .footer-title.quote {
    text-transform: none;
}
.agrya-banner .footer-divider {
    border: none;
    height: 1px;
    background-color: rgba(255, 255, 255, 0.2);
    margin: 1.6rem 0;
    width: 100%;
}
.agrya-banner .footer-bottom {
    display: flex;
    justify-content: space-between;
    align-items: center;
    width: 100%;
    padding: 0 5px;
}
.agrya-banner .footer-socials {
    display: flex;
    gap: 1.25rem;
    align-items: center;
    flex: 1;
}
.agrya-banner .social-icon {
    color: rgba(255, 255, 255, 0.55);
    transition: all 0.3s cubic-bezier(0.16, 1, 0.3, 1);
    display: inline-flex;
    align-items: center;
    justify-content: center;
    text-decoration: none;
}
.agrya-banner .social-icon:hover {
    color: #ffffff;
    transform: translateY(-2px);
}
.agrya-banner .footer-links {
    display: flex;
    gap: 2.8rem;
    justify-content: center;
    align-items: center;
    flex: 2;
}
.agrya-banner .footer-link {
    font-family: 'Outfit', sans-serif;
    font-size: 0.95rem;
    font-weight: 400;
    color: #ffffff;
    text-decoration: none;
    letter-spacing: 0.03em;
    transition: opacity 0.3s ease, transform 0.3s ease;
}
.agrya-banner .footer-link:hover {
    opacity: 0.75;
    transform: translateY(-1px);
}
.agrya-banner .footer-copyright {
    font-family: 'Outfit', sans-serif;
    font-size: 0.95rem;
    font-weight: 400;
    color: rgba(255, 255, 255, 0.45);
    text-align: right;
    flex: 1;
    letter-spacing: 0.02em;
}

/* ---------- Giant wordmark ---------- */
.agrya-banner .footer-logo-wrap {
    position: absolute;
    top: auto;
    bottom: 2vh;
    left: 0;
    right: 0;
    width: 100%;
    padding: 0 20px;
    box-sizing: border-box;
    display: flex;
    justify-content: center;
    align-items: center;
    z-index: 3;
    margin: 0;
}
.agrya-banner .footer-logo-text {
    font-family: 'General Sans', -apple-system, sans-serif;
    font-size: clamp(5rem, 20vw, 19rem);
    font-weight: 400;
    color: #ffffff;
    letter-spacing: -0.03em;
    margin-right: -0.03em;
    transform: none;
    line-height: 0.9;
    margin-top: 0;
    margin-bottom: 0;
    margin-left: 0;
    text-align: center;
    width: 100%;
    pointer-events: none;
    opacity: 0.95;
    text-shadow: none;
    white-space: nowrap;
}

/* ---------- Background flower visual ---------- */
.agrya-banner .video-container {
    position: absolute;
    inset: 0;
    width: 100%;
    height: 100%;
    overflow: hidden;
    z-index: 0;
    background: #000;
}
.agrya-banner #bg-video {
    position: absolute;
    top: 50%;
    left: 50%;
    width: 112%;
    height: 122%;
    object-fit: cover;
    display: block;
    transform: translate(-50%, -50%) scale(1);
    opacity: 0.8;
    animation: agrya-banner-kenburns 26s ease-in-out infinite alternate;
    filter: saturate(1.08) brightness(0.92);
}
@keyframes agrya-banner-kenburns {
    0%   { transform: translate(-50%, -50%) scale(1.0) rotate(0deg); }
    50%  { transform: translate(-52%, -48%) scale(1.09) rotate(0.4deg); }
    100% { transform: translate(-48%, -51%) scale(1.14) rotate(-0.3deg); }
}
/* soft breathing glow behind the lotus, like warm candle/incense light */
.agrya-banner .video-container::before {
    content: '';
    position: absolute;
    inset: 0;
    background: radial-gradient(circle at 50% 45%, rgba(57,255,20,0.10) 0%, rgba(57,255,20,0) 45%);
    animation: agrya-banner-breathe 6s ease-in-out infinite;
    z-index: 1;
    pointer-events: none;
}
@keyframes agrya-banner-breathe {
    0%, 100% { opacity: 0.5; }
    50% { opacity: 1; }
}
/* rising steam wisps, echoes the incense smoke in the source photo */
.agrya-banner .steam-wrap {
    position: absolute;
    inset: 0;
    z-index: 2;
    pointer-events: none;
    overflow: hidden;
}
.agrya-banner .wisp {
    position: absolute;
    bottom: 8%;
    width: 60px;
    height: 60px;
    background: radial-gradient(circle, rgba(255,255,255,0.16) 0%, rgba(255,255,255,0) 70%);
    border-radius: 50%;
    filter: blur(6px);
    animation: agrya-banner-rise linear infinite;
}
.agrya-banner .wisp:nth-child(1) { left: 16%; width: 50px; height: 50px; animation-duration: 9s; animation-delay: 0s; }
.agrya-banner .wisp:nth-child(2) { left: 19%; width: 34px; height: 34px; animation-duration: 11s; animation-delay: 2.5s; }
.agrya-banner .wisp:nth-child(3) { left: 14%; width: 42px; height: 42px; animation-duration: 13s; animation-delay: 5s; }
.agrya-banner .wisp:nth-child(4) { left: 21%; width: 28px; height: 28px; animation-duration: 10s; animation-delay: 7.5s; }
@keyframes agrya-banner-rise {
    0%   { transform: translateY(0) translateX(0) scale(0.8); opacity: 0; }
    15%  { opacity: 0.7; }
    50%  { transform: translateY(-38vh) translateX(2vw) scale(1.2); opacity: 0.45; }
    100% { transform: translateY(-78vh) translateX(-2vw) scale(1.6); opacity: 0; }
}

/* ---------- Reveal animations ---------- */
.agrya-banner .hero-title .word-wrapper {
    display: inline-block;
    overflow: hidden;
    vertical-align: bottom;
    padding-bottom: 0.15em;
    margin-bottom: -0.15em;
}
.agrya-banner .hero-title .word-inner {
    display: inline-block;
    opacity: 0;
    transform: translateY(105%);
    filter: blur(20px);
    animation: agrya-banner-word-reveal 1.3s cubic-bezier(0.05, 0.9, 0.1, 1) forwards;
}
@keyframes agrya-banner-word-reveal {
    0%   { opacity: 0; transform: translateY(105%); filter: blur(20px); }
    30%  { opacity: 1; }
    100% { opacity: 1; transform: translateY(0); filter: blur(0); }
}

@media (max-width: 700px) {
    .agrya-banner .hero-title { font-size: 1.7rem; }
    .agrya-banner .footer-title { font-size: 1rem; }
    .agrya-banner .footer-links { gap: 1.2rem; }
    .agrya-banner .footer-logo-text { font-size: 20vw; }
}
</style>

<script>
document.addEventListener('DOMContentLoaded', () => {
    const banner = document.querySelector('.agrya-banner');
    const heroTitle = banner && banner.querySelector('.hero-title');
    if (heroTitle) {
        const text = heroTitle.innerHTML;
        const parts = text.split(/(\s+|<br\s*\/?>)/i);
        heroTitle.innerHTML = '';

        let wordIndex = 0;
        parts.forEach(part => {
            if (part.trim() === '') {
                heroTitle.appendChild(document.createTextNode(' '));
            } else if (part.toLowerCase().startsWith('<br')) {
                heroTitle.appendChild(document.createElement('br'));
            } else {
                const wrapper = document.createElement('span');
                wrapper.className = 'word-wrapper';

                const inner = document.createElement('span');
                inner.className = 'word-inner';
                inner.textContent = part;

                inner.style.animationDelay = `${wordIndex * 0.1}s`;
                wordIndex++;

                wrapper.appendChild(inner);
                heroTitle.appendChild(wrapper);
            }
        });
    }

});
</script>
